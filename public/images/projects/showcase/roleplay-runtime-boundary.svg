<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Roleplay 访客演示运行边界</title>
  <desc id="desc">浏览器、静态游客前端、Node.js 服务端会话和模型上游之间的公开职责边界。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11111a" />
      <stop offset="1" stop-color="#1b1730" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b8cff" />
      <stop offset="1" stop-color="#7bd9ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".28" />
    </filter>
    <marker id="arrow" markerWidth="6" markerHeight="6" viewBox="0 0 10 10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8db7ff" />
    </marker>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#background)" />
  <circle cx="1360" cy="110" r="210" fill="#6c5ce7" opacity=".11" />
  <circle cx="210" cy="780" r="260" fill="#3fbed8" opacity=".08" />

  <text x="112" y="112" fill="#b6a8ff" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="700" letter-spacing="3">ROLEPLAY / PUBLIC BOUNDARY</text>
  <text x="112" y="172" fill="#f4f2ff" font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif" font-size="46" font-weight="700">游客演示运行边界</text>
  <text x="112" y="220" fill="#b9b6ca" font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif" font-size="24">主站只展示职责分层与低敏状态，不代理聊天请求，也不复制私有配置。</text>

  <g filter="url(#shadow)">
    <rect x="92" y="320" width="300" height="270" rx="24" fill="#211e36" stroke="#6e61c9" stroke-width="2" />
    <rect x="454" y="320" width="300" height="270" rx="24" fill="#211e36" stroke="#6e61c9" stroke-width="2" />
    <rect x="816" y="320" width="300" height="270" rx="24" fill="#211e36" stroke="#6e61c9" stroke-width="2" />
    <rect x="1178" y="320" width="330" height="270" rx="24" fill="#211e36" stroke="#6e61c9" stroke-width="2" />
  </g>

  <g fill="#f4f2ff" font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif">
    <text x="132" y="388" font-size="28" font-weight="700">浏览器</text>
    <text x="132" y="432" fill="#b9b6ca" font-size="21">公开页面与游客输入</text>
    <text x="132" y="478" fill="#b9b6ca" font-size="21">不保存模型密钥</text>
    <text x="132" y="524" fill="#b9b6ca" font-size="21">只访问公开 HTTPS 入口</text>

    <text x="494" y="388" font-size="28" font-weight="700">静态游客前端</text>
    <text x="494" y="432" fill="#b9b6ca" font-size="21">HTML / CSS / JavaScript</text>
    <text x="494" y="478" fill="#b9b6ca" font-size="21">角色库与独立故事路由</text>
    <text x="494" y="524" fill="#b9b6ca" font-size="21">会话交互边界</text>

    <text x="856" y="388" font-size="28" font-weight="700">Node.js 服务端</text>
    <text x="856" y="432" fill="#b9b6ca" font-size="21">角色卡与会话控制</text>
    <text x="856" y="478" fill="#b9b6ca" font-size="21">HttpOnly Cookie / 限流</text>
    <text x="856" y="524" fill="#b9b6ca" font-size="21">主站不代理此请求</text>

    <text x="1218" y="388" font-size="28" font-weight="700">模型上游</text>
    <text x="1218" y="432" fill="#b9b6ca" font-size="21">GLM 游客模式</text>
    <text x="1218" y="478" fill="#b9b6ca" font-size="21">并发与延迟受独立服务控制</text>
    <text x="1218" y="524" fill="#b9b6ca" font-size="21">不构成长期健康承诺</text>
  </g>

  <g stroke="url(#accent)" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M400 455H444" />
    <path d="M762 455H806" />
    <path d="M1124 455H1168" />
  </g>

  <rect x="92" y="686" width="1416" height="112" rx="20" fill="#171522" stroke="#3c365b" />
  <text x="132" y="735" fill="#f4f2ff" font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif" font-size="24" font-weight="700">公开证据边界</text>
  <text x="132" y="774" fill="#b9b6ca" font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif" font-size="21">入口、角色数量与配置标签可做低敏状态记录；API Key、上游地址、管理员令牌、访客消息和完整角色卡内容留在独立服务端。</text>
</svg>
