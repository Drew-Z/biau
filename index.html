<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      ;(() => {
        const root = document.documentElement
        let theme = 'morning'
        try {
          const storedTheme = localStorage.getItem('biau-port-theme')
          const storedScene = localStorage.getItem('biau-port-harbor-scene')
          const storedMode = localStorage.getItem('theme')
          if (storedTheme === 'morning' || storedTheme === 'nature' || storedTheme === 'stellar') theme = storedTheme
          else if (storedScene === 'dusk') theme = 'morning'
          else if (storedScene === 'garden') theme = 'nature'
          else if (storedScene === 'stellar') theme = 'stellar'
          else if (storedMode === 'dark') theme = 'stellar'
          localStorage.setItem('biau-port-theme', theme)
        } catch {}
        root.dataset.siteTheme = theme
        root.dataset.siteThemeVersion = '1'
        root.classList.toggle('light-theme', theme !== 'stellar')
        root.style.colorScheme = theme === 'stellar' ? 'dark' : 'light'
        root.dataset.performance = 'balanced'
      })()
    </script>
    <meta
      name="description"
      content="BIAU Port 泊岸用 React、Vite 与自定义设计系统组织 AI 应用、业务系统、游戏项目、移动端案例和技术知识库。"
    />
    <link rel="canonical" href="https://biau.playlab.eu.cc/" />
    <meta property="og:site_name" content="BIAU Port / 泊岸" />
    <meta property="og:title" content="BIAU Port 泊岸 | AI 应用、项目展示与知识库" />

    />

    <meta

      html,
      body,

        min-height: 100%;
        margin: 0;

      body { background: var(--biau-prepaint-background, #f4e7df); }
      :root[data-site-theme='morning'] { --biau-prepaint-background: linear-gradient(122deg, #d5566d 0%, #e9e89d 23%, #90bfe0 47%, #333ca0 79%, #16497b 100%); }
      :root[data-site-theme='nature'] { --biau-prepaint-background: linear-gradient(122deg, #e6d6f9 0%, #c5b2d2 6%, #98dddf 24%, #8fd695 58%, #61a769 74%, #5b873d 100%); }
      :root[data-site-theme='stellar'] { --biau-prepaint-background: linear-gradient(122deg, #59575c 0%, #2b315f 30%, #354b7b 47%, #092243 70%, #052433 100%); }
