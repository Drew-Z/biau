name: Reliability Check

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: read

jobs:
  reliability-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check report contract
        run: npm run main-site:health-check && npm run reliability:report-check

      - name: Run reliability suite
        run: npm --silent run reliability:check -- --strict --json > "$RUNNER_TEMP/reliability-report.json"

      - name: Upload status reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reliability-status
          path: ${{ runner.temp }}/reliability-report.json
          if-no-files-found: warn
          retention-days: 7
